name = "kamome-routing"
main = "src/index.js"
compatibility_date = "2026-08-20"

# 🔴 **Also load-bearing.** Both of these are `true` by default, and leaving them
# to the default is what `wrangler deploy` warns about. Written here for the same
# reason as `[observability]` below: in the deployed config rather than in
# someone's memory.
#
# `workers_dev` is the production hostname the app will call —
# `kamome-routing.<subdomain>.workers.dev`. It stays on.
#
# `preview_urls` is the *other* door. With it on, Cloudflare gives every deployed
# version its own permanent public hostname,
# `<first-8-of-version-id>-kamome-routing.<subdomain>.workers.dev`, running the
# same code with the same `GEOAPIFY_API_KEY` binding. Measured 2026-08-27, not
# assumed: the preview host of version 75c481ad answered a keyless
# `GET /v1/routing` with **200 and 9,842 bytes of route** — the same body
# production returned. So each deploy adds a permanent extra public door onto
# Kamome's Geoapify quota, and the hostname costs an attacker nothing to guess:
# it was derived from the Version ID at the first attempt. `x-robots-tag:
# noindex`, which Cloudflare sets on these, stops indexing — not access.
#
# **Do not turn this back on as tidying.** Kamome does not use versioned or
# gradual deploys, so nothing is lost. If a preview is ever genuinely needed,
# deploy it to a Worker that holds no production secret.
workers_dev = true
preview_urls = false

# 🔴 **Load-bearing, not tidiness** (`Docs/pre-launch.md`). Workers Logs record
# request URLs, and `/v1/routing` is GET-only — so every logged line would carry
# a trip's coordinates *and*, before this Worker existed, the API key. §0 says a
# proxy that logs makes the privacy story worse while appearing to make it
# better. Off here, in the deployed config, rather than in someone's memory.
[observability]
enabled = false

# The key is a secret, never a var:
#   wrangler secret put GEOAPIFY_API_KEY
# `vars` would put it in this file, which is committed.

# The spend ceiling's storage: one SQLite-backed Durable Object, `RoutingBudget`
# in `src/index.js` (ADR 2026-10-03, replacing the KV counter of ADR 2026-09-04).
#
# Why not KV any more, VERIFIED from Cloudflare's limits page 2026-10-03: the
# free plan allows **1,000 KV writes a day** and **one write a second to the same
# key**. The counter wrote one key once per request, so the real ceiling was
# 1,000, and past it every request failed closed at 503 until UTC midnight
# (#204). The free plan's Durable Object allowance is 100,000 requests and
# 100,000 rows written a day — one of each per routing request.
#
# ⚠️ **No `wrangler rollback` across this migration.** VERIFIED from Cloudflare's
# rollback docs 2026-10-03: a rollback is refused when a Durable Object class
# lifecycle change lies between the two versions. Recovery from a bad deploy of
# this is a forward fix, so this change's controls run before the deploy.
#
# The old KV namespace `d533d7ee1b7d4a3c8ffcf51fe8701b33` is unbound, not
# deleted. Deleting it is Chiu's call.
[[durable_objects.bindings]]
name = "KAMOME_BUDGET"
class_name = "RoutingBudget"

[[migrations]]
tag = "v1-routing-budget"
new_sqlite_classes = ["RoutingBudget"]

# 🔴 **The only ceiling that can exist anywhere.** VERIFIED from Geoapify's own
# pages, 2026-08-29: their limits are *soft on every tier*, there is no
# customer-settable cap, and escalation ends in **account blocking** — so the
# worst case is not a daily outage that clears at midnight, it is every user
# losing routing until Chiu resolves it with the provider by hand.
#
# 2000 is Chiu's number (2026-09-04), and the arithmetic behind it: Geoapify's
# free tier is 3,000 credits a day and Kamome spends one request per drive leg —
# 9 on Miyakojima, 17 on New Zealand, 58 on Iceland. 2000 is ~34 Iceland-sized
# imports a day, far above any dogfooding load, and it stops *below* the
# provider's soft limit so a burst never reaches the thing that triggers their
# emails. His words: *"2000 可以，之後有需要再改"* — a value to revisit, not a
# constant to reason from.
# 🔴 **The burst limit — the ceiling's complement, never its replacement.**
# The per-day counter above cannot express a burst, and this cannot express a
# day: Cloudflare's maximum `period` is 60 s. Both exist because neither is the
# other, and the reason the pair is needed at all is KV's read cache — measured
# 2026-09-04, its window is *tens of seconds*, so a single client could spend the
# whole 2000 inside one window while the counter still read low. The counter is
# exact since ADR 2026-10-03, and this binding still matters: an exact counter
# lets one address spend the whole day in a minute just as faithfully.
#
# **60/min is the number, and the floor under it is real traffic, not taste.**
# Kamome's own legitimate burst is ~29 requests/minute (Iceland's 58 legs inside
# `matching.trip_budget_s` 120), so anything at or below ~30/min throttles a
# genuine import. 60 leaves room for two such imports at once and still caps a
# single address two orders of magnitude below the 3,000-credit day.
#
# ⚠️ **VERIFIED from Cloudflare's own docs, 2026-09-05:** *"For each unique key
# you pass to your rate limiting binding, there is a unique limit per Cloudflare
# location."* The limit is therefore **per colo, not global** — a client spread
# across locations gets 60/min in each. That is exactly why this is a speed bump
# and the per-day ceiling is the guard: never mistake one for the other.
#
# ⚠️ Keyed by `CF-Connecting-IP`, so everyone behind one carrier NAT shares a
# bucket. At 60/min that is two concurrent Iceland-sized imports per address per
# location. Raise this value if that ever bites — it is configuration.
#
# `namespace_id` is **not provisioned and touches no account of Chiu's**:
# Cloudflare defines it as *"a string containing a positive integer that uniquely
# defines this rate limiting namespace within your Cloudflare account"*. It is a
# name, chosen here, not a resource created somewhere.
[[ratelimits]]
name = "KAMOME_BURST"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
DAILY_REQUEST_CEILING = "2000"

# The burst refusal's `Retry-After`, in seconds. It **must equal the `period`
# above** and a test asserts exactly that, because the binding exposes only
# `.limit()` — the Worker cannot read its own period, so the alternative to this
# pair is a literal 60 in the source, which is the thing `CLAUDE.md` rule 7
# forbids. The window is aligned to the wall clock, so the true wait is *at most*
# one period: this is an honest upper bound, never an under-estimate that would
# invite an early retry.
BURST_RETRY_AFTER_S = "60"

# Where the counter object is first created — a Cloudflare region code, used
# once and ignored afterwards, because an object never moves (VERIFIED,
# Cloudflare docs 2026-10-03). Every routing request makes one round trip from
# the Worker's location to the object's, so it belongs where the Worker runs for
# most requests.
#
# `wnam` (western North America) is from one measurement, not a survey:
# 2026-10-03, this Mac in Taiwan (`loc=TW`) is served from **SJC**, San Jose
# (`/cdn-cgi/trace`). Where a phone on a Taiwanese carrier lands is UNKNOWN; the
# cheapest check is opening `/cdn-cgi/trace` on this hostname from the phone.
# If it is wrong, renaming `BUDGET_OBJECT_NAME` in the source creates a new
# object under a new hint.
BUDGET_LOCATION_HINT = "wnam"
