name = "kamome-routing"
main = "src/index.js"
compatibility_date = "2026-08-20"

# 🔴 **Also load-bearing.** Both of these are `true` by default, and leaving them
# to the default is what `wrangler deploy` warns about. Written here for the same
# reason as `[observability]` below: in the deployed config rather than in
# someone's memory.
#
# `workers_dev` is the production hostname the app will call —
# `kamome-routing.<subdomain>.workers.dev`. It stays on.
#
# `preview_urls` is the *other* door. With it on, Cloudflare gives every deployed
# version its own permanent public hostname,
# `<first-8-of-version-id>-kamome-routing.<subdomain>.workers.dev`, running the
# same code with the same `GEOAPIFY_API_KEY` binding. Measured 2026-08-27, not
# assumed: the preview host of version 75c481ad answered a keyless
# `GET /v1/routing` with **200 and 9,842 bytes of route** — the same body
# production returned. So each deploy adds a permanent extra public door onto
# Kamome's Geoapify quota, and the hostname costs an attacker nothing to guess:
# it was derived from the Version ID at the first attempt. `x-robots-tag:
# noindex`, which Cloudflare sets on these, stops indexing — not access.
#
# **Do not turn this back on as tidying.** Kamome does not use versioned or
# gradual deploys, so nothing is lost. If a preview is ever genuinely needed,
# deploy it to a Worker that holds no production secret.
workers_dev = true
preview_urls = false

# 🔴 **Load-bearing, not tidiness** (`Docs/pre-launch.md`). Workers Logs record
# request URLs, and `/v1/routing` is GET-only — so every logged line would carry
# a trip's coordinates *and*, before this Worker existed, the API key. §0 says a
# proxy that logs makes the privacy story worse while appearing to make it
# better. Off here, in the deployed config, rather than in someone's memory.
[observability]
enabled = false

# The key is a secret, never a var:
#   wrangler secret put GEOAPIFY_API_KEY
# `vars` would put it in this file, which is committed.

# The spend ceiling's storage. Created 2026-09-04 on Chiu's instruction; the id
# is an identifier, not a secret — Cloudflare's own snippet puts it in this file.
#
# ⚠️ **Bound before its reader exists, deliberately.** The counter itself is not
# built (`README.md`, "Not built, and deliberately"); this binding and the
# ceiling below are here so the session that writes it has nothing to provision
# and no account of Chiu's to touch. A binding with no reader is inert.
[[kv_namespaces]]
binding = "KAMOME_BUDGET"
id = "d533d7ee1b7d4a3c8ffcf51fe8701b33"

# 🔴 **The only ceiling that can exist anywhere.** VERIFIED from Geoapify's own
# pages, 2026-08-29: their limits are *soft on every tier*, there is no
# customer-settable cap, and escalation ends in **account blocking** — so the
# worst case is not a daily outage that clears at midnight, it is every user
# losing routing until Chiu resolves it with the provider by hand.
#
# 2000 is Chiu's number (2026-09-04), and the arithmetic behind it: Geoapify's
# free tier is 3,000 credits a day and Kamome spends one request per drive leg —
# 9 on Miyakojima, 17 on New Zealand, 58 on Iceland. 2000 is ~34 Iceland-sized
# imports a day, far above any dogfooding load, and it stops *below* the
# provider's soft limit so a burst never reaches the thing that triggers their
# emails. His words: *"2000 可以，之後有需要再改"* — a value to revisit, not a
# constant to reason from.
[vars]
DAILY_REQUEST_CEILING = "2000"
