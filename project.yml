# Kamome.xcodeproj is generated from this file via `xcodegen generate`.
# NEVER hand-edit the .xcodeproj (spec §11.1); it is gitignored.
name: Kamome
options:
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.chiu

packages:
  KamomeCore:
    path: .
  # Recap base-map substrate (spec §4.5 step 2; ADR 2026-07-19). MapLibre is
  # confined to App/Services/MapLibreSnapshotProvider.swift — the only file that
  # imports it (CI grep gate). Pinned exactly: golden-frame CI must be
  # reproducible, and a floating map SDK is not.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.27.0

targets:
  Kamome:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - path: Config/TrackingConfig.json
        buildPhase: resources
      # Recap theme style JSON (§4.5 step 2 substrate). functional-base is the
      # §2 substrate; modern-minimal is the §3 DRAFT (not signed off — MapKit
      # stays the shipping base map until Chiu's design review clears it).
      - path: Config/RecapThemes/functional-base.json
        buildPhase: resources
      - path: Config/RecapThemes/modern-minimal.json
        buildPhase: resources
    dependencies:
      - package: KamomeCore
        product: KamomePersistence
      - package: KamomeCore
        product: KamomeConfig
      - package: KamomeCore
        product: KamomeTrackingEngine
      - package: KamomeCore
        product: KamomeTripComposer
      - package: KamomeCore
        product: KamomeExportEngine
      - package: KamomeCore
        product: KamomeRouteMatching
      - package: KamomeCore
        product: KamomeImportKit
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kamome
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        # Purpose strings are localized in App/Resources/InfoPlist.xcstrings;
        # tracking only ever runs during an explicit trip (§6).
        NSLocationWhenInUseUsageDescription: Kamome records your route only during an active trip you started.
        NSLocationAlwaysAndWhenInUseUsageDescription: Always access lets Kamome keep recording an active trip in the background. Tracking stops the moment you end the trip.
        NSMotionUsageDescription: Motion data tells driving from walking so Kamome can save battery while recording.
        NSPhotoLibraryUsageDescription: Kamome reads photos taken during your trips to place them on your route. Selected-photos access works too. Photos are never copied or uploaded.
        UIBackgroundModes: [location]
        # Map-region side-load for the Replay MVP dogfood gate (PD-7,
        # Docs/dogfood-infrastructure.md): a `.pmtiles` region is dragged into
        # the app's Documents folder over Finder, so the three gate trips can be
        # given tiles without a rebuild and without bloating the binary. Tile
        # provisioning proper is a backend problem (spec P7); this is the
        # deliberately boring stand-in until it exists.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Reaching the dogfood OSRM, which runs on the developer's Mac over home
        # Wi-Fi (`Docs/dogfood-infrastructure.md`). Two separate iOS gates stand
        # between a device build and `http://192.168.x.x:5100`, and both fail
        # quietly — the request just errors, and PD-2 then renders every leg
        # dashed with nothing saying why.
        #
        # `NSAllowsLocalNetworking` is the *narrow* ATS exemption: it permits
        # cleartext only to private-range IPs, `.local`, and unqualified
        # hostnames. Public HTTP stays blocked, which is why this is not
        # `NSAllowsArbitraryLoads`. Production routing is HTTPS behind Caddy
        # (spec P7), and this key costs nothing then.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kamome reconstructs your route using a routing service you run on your own computer. It is only contacted while you import or export a trip, and only on your local network.
    settings:
      base:
        # Placeholder until the trademark check clears (spec §11.1).
        DEVELOPMENT_TEAM: B9U326WRA4
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.chiu.kamome.dev
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KamomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kamome

schemes:
  Kamome:
    build:
      targets:
        Kamome: all
    test:
      gatherCoverageData: false
      targets:
        - KamomeTests
        - package: KamomeCore/KamomeCoreTests
      # **Why the harness variables are declared here, and in this exact shape**
      # (2026-08-15). `TEST_RUNNER_<VAR>=…` on the xcodebuild command line was
      # reaching nothing: every env-gated desk harness skipped silently, which is
      # the worst way for a measurement tool to fail — it reports success and
      # measures nothing. Three findings, each verified by changing only itself:
      #
      #   1. With no `environmentVariables` at all, XcodeGen emits the test action
      #      with `shouldUseLaunchSchemeArgsEnv = "YES"`; the test action then takes
      #      the *Launch* action's environment. Declaring anything flips it to "NO".
      #   2. That alone is not enough. On Xcode 26.6 xcodebuild's `TEST_RUNNER_`
      #      injection does not reach the test process at all, with the flag either
      #      way. Declaring the variables empty-and-disabled — the obvious fix —
      #      changes nothing, because there was never an injection to un-shadow.
      #   3. What xcodebuild *does* do with `TEST_RUNNER_FOO=bar` is define it as a
      #      **build setting**. Scheme environment values expand build settings, so
      #      `$(TEST_RUNNER_FOO)` bridges the two.
      #
      # Hence the shape below. The documented command line is unchanged — every
      # `TEST_RUNNER_…` in the harness doc comments still works — and it survives
      # `xcodegen generate`, which the hand-patched scheme did not.
      #
      # An unset variable arrives as a defined **empty string**, not as nothing;
      # `HarnessEnv.value` collapses that back to nil, and harnesses must read
      # through it rather than `ProcessInfo` directly. A new harness variable needs
      # a line here or it will never be settable.
      environmentVariables:
        - { variable: KAMOME_ALLOCATION_ZERO_SHARE, value: "$(TEST_RUNNER_KAMOME_ALLOCATION_ZERO_SHARE)", isEnabled: true }
        - { variable: KAMOME_BUDGET_DURATIONS, value: "$(TEST_RUNNER_KAMOME_BUDGET_DURATIONS)", isEnabled: true }
        - { variable: KAMOME_BUDGET_FIXTURE, value: "$(TEST_RUNNER_KAMOME_BUDGET_FIXTURE)", isEnabled: true }
        - { variable: KAMOME_DEMO_FILM, value: "$(TEST_RUNNER_KAMOME_DEMO_FILM)", isEnabled: true }
        - { variable: KAMOME_DEMO_OUT, value: "$(TEST_RUNNER_KAMOME_DEMO_OUT)", isEnabled: true }
        - { variable: KAMOME_DEMO_RENDER, value: "$(TEST_RUNNER_KAMOME_DEMO_RENDER)", isEnabled: true }
        - { variable: KAMOME_DURATION_RULE_REPORT, value: "$(TEST_RUNNER_KAMOME_DURATION_RULE_REPORT)", isEnabled: true }
        - { variable: KAMOME_E, value: "$(TEST_RUNNER_KAMOME_E)", isEnabled: true }
        - { variable: KAMOME_FOLLOWCAM_STILLS, value: "$(TEST_RUNNER_KAMOME_FOLLOWCAM_STILLS)", isEnabled: true }
        - { variable: KAMOME_FORCE_DURATION_S, value: "$(TEST_RUNNER_KAMOME_FORCE_DURATION_S)", isEnabled: true }
        - { variable: KAMOME_KEYFRAME_INTERVAL, value: "$(TEST_RUNNER_KAMOME_KEYFRAME_INTERVAL)", isEnabled: true }
        - { variable: KAMOME_LIVE_GEOCODE, value: "$(TEST_RUNNER_KAMOME_LIVE_GEOCODE)", isEnabled: true }
        - { variable: KAMOME_MARKER_STILLS, value: "$(TEST_RUNNER_KAMOME_MARKER_STILLS)", isEnabled: true }
        - { variable: KAMOME_MATCHING_E, value: "$(TEST_RUNNER_KAMOME_MATCHING_E)", isEnabled: true }
        - { variable: KAMOME_OSRM_BASE_URL, value: "$(TEST_RUNNER_KAMOME_OSRM_BASE_URL)", isEnabled: true }
        - { variable: KAMOME_OSRM_CAPTURE, value: "$(TEST_RUNNER_KAMOME_OSRM_CAPTURE)", isEnabled: true }
        - { variable: KAMOME_PILOT_FILM, value: "$(TEST_RUNNER_KAMOME_PILOT_FILM)", isEnabled: true }
        - { variable: KAMOME_PILOT_SECONDS, value: "$(TEST_RUNNER_KAMOME_PILOT_SECONDS)", isEnabled: true }
        - { variable: KAMOME_PLACEMARK_LIMIT, value: "$(TEST_RUNNER_KAMOME_PLACEMARK_LIMIT)", isEnabled: true }
        - { variable: KAMOME_PLACEMARK_SURVEY, value: "$(TEST_RUNNER_KAMOME_PLACEMARK_SURVEY)", isEnabled: true }
        - { variable: KAMOME_RECAP_MODE, value: "$(TEST_RUNNER_KAMOME_RECAP_MODE)", isEnabled: true }
        - { variable: KAMOME_RENDER_BENCH, value: "$(TEST_RUNNER_KAMOME_RENDER_BENCH)", isEnabled: true }
        - { variable: KAMOME_RENDER_OUT, value: "$(TEST_RUNNER_KAMOME_RENDER_OUT)", isEnabled: true }
        - { variable: KAMOME_RENDER_STILLS, value: "$(TEST_RUNNER_KAMOME_RENDER_STILLS)", isEnabled: true }
        - { variable: KAMOME_SNAPSHOT_AUDIT, value: "$(TEST_RUNNER_KAMOME_SNAPSHOT_AUDIT)", isEnabled: true }
        - { variable: KAMOME_STOP_PHOTOS, value: "$(TEST_RUNNER_KAMOME_STOP_PHOTOS)", isEnabled: true }
        - { variable: KAMOME_STOP_STILL, value: "$(TEST_RUNNER_KAMOME_STOP_STILL)", isEnabled: true }
        - { variable: KAMOME_TERRAIN_PATH, value: "$(TEST_RUNNER_KAMOME_TERRAIN_PATH)", isEnabled: true }
        - { variable: KAMOME_TILES_PATH, value: "$(TEST_RUNNER_KAMOME_TILES_PATH)", isEnabled: true }
        - { variable: KAMOME_TIMELINE_DUMP, value: "$(TEST_RUNNER_KAMOME_TIMELINE_DUMP)", isEnabled: true }
        - { variable: KAMOME_TIMELINE_REPORT, value: "$(TEST_RUNNER_KAMOME_TIMELINE_REPORT)", isEnabled: true }
        - { variable: KAMOME_TITLE_STILL, value: "$(TEST_RUNNER_KAMOME_TITLE_STILL)", isEnabled: true }
