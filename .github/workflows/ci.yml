name: CI

# CI runs exactly what a developer runs: ./check.sh. Every gate lives in
# Scripts/ so the two can never drift — a check that only exists in this file
# cannot be run before pushing, and a check that only runs locally does not
# guard the branch.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Pick an available iPhone simulator
        # Runner images vary in which device sets they ship — never hardcode
        # a model name.
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available \
            | grep -E "^\s+iPhone" | head -1 | sed -E 's/^ *([^(]+[^ (]) *\(.*/\1/')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator on runner" >&2; exit 1; fi
          echo "Using simulator: $DEVICE"
          echo "KAMOME_TEST_DESTINATION=platform=iOS Simulator,name=$DEVICE" >> "$GITHUB_ENV"

      - name: ./check.sh
        run: ./check.sh
